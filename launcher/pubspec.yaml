name: powerterminal_launcher
description: "Launcher gráfico do PowerTerminal: instala, atualiza e remove módulos pela CLI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf

  uses-material-design: true
