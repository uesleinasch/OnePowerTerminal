# =====================================================================
# Kitty configuration
# Docs: https://sw.kovidgoyal.net/kitty/conf/
# Reload after editing: ctrl+shift+f5  (or kill+restart kitty)
# =====================================================================

# ---------- Fonte ----------
font_family       Fira Code
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         12.0
disable_ligatures never
modify_font cell_height 110%

# ---------- Janela ----------
window_padding_width   8
hide_window_decorations no
confirm_os_window_close 0

# Janela: minimizar / maximizar / fullscreen sem barra de título
map alt+enter         toggle_maximized
map f11               toggle_fullscreen
map ctrl+shift+f11    toggle_fullscreen
map ctrl+shift+f10    toggle_maximized
map ctrl+shift+m      launch --type=background wmctrl -r :ACTIVE: -b add,hidden
remember_window_size    yes
initial_window_width    1280
initial_window_height   800

# ---------- Cursor ----------
cursor_shape           beam
cursor_blink_interval  0.5
cursor_stop_blinking_after 5.0

# ---------- Scrollback ----------
scrollback_lines 20000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ---------- URLs ----------
url_style curly
detect_urls yes

# ---------- Performance ----------
repaint_delay   8
input_delay     2
sync_to_monitor yes

# ---------- Bell ----------
enable_audio_bell no
visual_bell_duration 0.05

# ---------- Clipboard ----------
copy_on_select clipboard
strip_trailing_spaces smart

# =====================================================================
# Tabs
# =====================================================================
tab_bar_edge            top
# Cor por aba (ciclada pelo índice): ver ~/.config/kitty/tab_bar.py
# Para voltar ao padrão, troque por: tab_bar_style powerline
tab_bar_style           custom
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# Atalhos extras de aba
map ctrl+t          new_tab
map ctrl+w          close_tab
map ctrl+1          goto_tab 1
map ctrl+2          goto_tab 2
map ctrl+3          goto_tab 3
map ctrl+4          goto_tab 4
map ctrl+5          goto_tab 5
map ctrl+6          goto_tab 6
map ctrl+7          goto_tab 7
map ctrl+8          goto_tab 8
map ctrl+9          goto_tab 9
map ctrl+shift+r    set_tab_title

# =====================================================================
# Sessões — salvar/restaurar abas, splits, cwd e programas
# =====================================================================
# Controle remoto: necessário para o save-session.py inspecionar o estado.
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Ao abrir o kitty, restaura a última sessão salva.
startup_session last-session.kitty

# Salvar a sessão atual (faça antes de fechar/reiniciar):
map ctrl+shift+s launch --type=background --keep-focus ~/.config/kitty/save-session.py

# =====================================================================
# Layouts (splits dentro da aba)
# =====================================================================
enabled_layouts splits,stack,tall

# Destaque do split em foco:
# - moldura completa ao redor de cada janela (não só o traço fino entre elas)
# - splits inativos com texto a 70% para o foco "saltar" aos olhos
# As cores ficam em active_border_color / inactive_border_color (seção Tema).
window_border_width   2pt
draw_minimal_borders  no
inactive_text_alpha   0.5

# Splits
map f5 launch --location=hsplit --cwd=current
map f6 launch --location=vsplit --cwd=current
map f7 layout_action rotate

# Zoom: maximiza/restaura o split atual (alterna entre o layout atual e "stack").
# Sobrescreve o default ctrl+shift+z = scroll_to_prompt -1 (movido p/ ctrl+shift+d).
map ctrl+shift+z toggle_layout stack

# Salto de prompt (shell integration): "anterior" remapeado p/ liberar o ctrl+shift+z.
# O "próximo prompt" (ctrl+shift+x) e "última saída" (ctrl+shift+g) continuam nos defaults.
map ctrl+shift+d scroll_to_prompt -1

# Mover entre janelas (splits)
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Redimensionar janelas
map ctrl+alt+h resize_window narrower
map ctrl+alt+l resize_window wider
map ctrl+alt+k resize_window taller
map ctrl+alt+j resize_window shorter

# =====================================================================
# Tema (Catppuccin — latte, frappe, macchiato ou mocha)
# Trocar: `powerterminal theme latte` (muda também Neovim e prompt)
# =====================================================================
# As cores todas vêm daqui; os arquivos em themes/ são o porte oficial
# (github.com/catppuccin/kitty), copiados sem modificação.
include current-theme.conf

# A moldura do split em foco é a única cor que sai do tema de propósito:
# o lavender/blue dos flavors não destaca o suficiente com draw_minimal_borders no.
active_border_color     #ff5fd7
